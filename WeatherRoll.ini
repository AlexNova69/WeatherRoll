; =====================================================================
;  WeatherRoll.ini — настройки полноэкранного скрипта погоды WeatherRoll.qml
;
;  Файл лежит рядом с WeatherRoll.qml и перечитывается вместе с данными
;  каждые reloadIntervalMs — правки применяются к показу без перезапуска
;  (сменить видео/музыку можно только перевыводом элемента в дизайнере).
;
;  ПРАВИЛА:
;   • «ключ = значение»; ПУСТОЕ значение — берётся значение из QML;
;   • пояснение пишется ПОСЛЕ значения и отделяется « ; »
;     (пробел — точка с запятой — пробел); всё после него игнорируется;
;   • строки, начинающиеся с «;», и заголовки «[...]» — комментарии;
;   • true/false можно писать как 1/0, да/нет, on/off;
;   • цвета — #RRGGBB или #AARRGGBB (AA — прозрачность);
;   • пути — только с прямыми слэшами: file:///D:/Project/WeatherRoll/…
; =====================================================================

[файлы]

weatherFileUrl =      ; файл погоды, пишет его WeatherCollector ; напр. file:///D:/Project/WeatherRoll/weather.txt
backgroundImageUrl =  ; фоновая картинка jpg/png (tga — если в сборке Qt есть плагин TGA) ; пусто = тёмно-синий градиент
introVideoUrl =       ; видео-заставка ПЕРЕД показом (играет от начала до конца файла)
outroVideoUrl =       ; видео В КОНЦЕ показа (когда loopPlayback = false, или по Esc/Q)
musicUrl =            ; музыка во время показа (wav или mp3), играет по кругу
musicVolume =         ; громкость музыки, 0..1 ; напр. 0.7

[заставка и показ]

splashDurationMs =    ; длительность СТАТИЧЕСКОЙ заставки, мс ; авто-ограничение 3000..8000, напр. 5000
sectionShowTimeMs =   ; время показа одной секции, мс ; напр. 9000
sectionTimes =        ; своё время для секции по имени, БЕЗ пробелов вокруг «;» ; напр. Сейчас=8000;Завтра=12000
autoAdvance =         ; автосмена секций по таймеру ; true/false
loopPlayback =        ; показ по кругу ; false — после последней секции конечная заставка
transitionStyle =     ; эффект смены секций: flip (переворот), slideLeft, slideRight, slideUp, slideDown
transitionDurationMs = ; длительность эффекта смены секций, мс ; напр. 800
reloadIntervalMs =    ; период перечитывания данных погоды и этого ini, мс ; напр. 300000 (5 мин), 0 = выключить

[квадраты и подписи]

cardsMax =            ; максимум квадратов с данными в сетке ; по умолчанию 4
cardsColumns =        ; колонок в сетке квадратов ; по умолчанию 2
sourceNote =          ; мелкая подпись-источник внизу слева ; напр. Данные: Open-Meteo ; пусто = подпись из QML
fontFamily =          ; шрифт всех надписей ; напр. Arial

[погодная иконка]

showWeatherIcon =     ; анимационные иконки погоды слева и справа от квадрата с температурой (рисуются самим QML, загрузка локальная) ; true/false

[оформление — цвета #AARRGGBB]

bgColorTop =          ; верхняя часть градиента фона ; по умолчанию #FF0B1B33
bgColorBottom =       ; нижняя часть градиента фона ; по умолчанию #FF14335C
cityTextColor =       ; цвет названия города вверху ; по умолчанию белый
cardColor =           ; полупрозрачный фон квадратов и плашки описания ; по умолчанию #B3164067
cardBorderColor =     ; рамка квадратов и плашки ; по умолчанию #FF3D6DA6
cardLabelColor =      ; мелкая подпись в квадрате (НОЧЬЮ, ТЕМПЕРАТУРА…) ; по умолчанию #FFAFC4E0
cardValueColor =      ; крупные цифры/значения в квадратах ; по умолчанию белый
descTextColor =       ; крупный текст описания в нижней плашке ; по умолчанию #FFF4F4F4
accentColor =         ; акцентный цвет: полоса под заголовком секции, кольцо заставки ; по умолчанию #FFE2543B
errorColor =          ; сообщения об ошибках ; по умолчанию #FFFF6A4D
outlineColor =        ; цвет обводки текста для читаемости на видео ; по умолчанию #CC101010
enableOutline =       ; обводка текста вкл/выкл ; true/false
